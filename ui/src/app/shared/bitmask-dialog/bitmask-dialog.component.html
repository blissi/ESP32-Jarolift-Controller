<h2 mat-dialog-title>{{ "bitmask_wizard" | translate }}</h2>
<mat-dialog-content class="mat-typography">
  <article class="dash">
    <div class="dash-main">
      <div>
        <div class="leftright" *ngFor="let bitState of this.bitStates">
          <ng-container *ngIf="bitState.shutter.isEnabled">
            <label for="channel-{{bitState.shutter.index}}">{{ bitState.shutter.name }}</label>
            <input type="checkbox" [(ngModel)]="bitState.isChecked" />
          </ng-container>
        </div>
      </div>
    </div>
  </article>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button (click)="onApply()">{{ "apply" | translate }}</button>
  <button [mat-dialog-close]="true" cdkFocusInitial>{{ "cancel" | translate }}</button>
</mat-dialog-actions>
