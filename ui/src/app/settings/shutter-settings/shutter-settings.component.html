<div class="row">
    <label for="shutter">{{ "channel" | translate }} {{ model.index + 1 }}</label>
    <input name="shutter" type="text" placeholder="name" [(ngModel)]="model.name" />
    <div>
        <button>{{ "unlearn" | translate }}</button>
    </div>
    <div>
        <button>{{ "learn" | translate }}</button>
    </div>
    <div>
        <input type="checkbox" role="switch" [(ngModel)]="model.isEnabled" />
    </div>
</div>
