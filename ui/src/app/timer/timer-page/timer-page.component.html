<div class="grid" id="timers-container">
    <article>
        <div class="dash-main">
            <div class="dash-header">Timer 1</div>
            <div class="section-header">
                <label for="timer0_enable">{{ "activate" | translate }}</label>
                <div class="switch-container">
                    <input name="timer0_enable" type="checkbox" role="switch" hideOpt="OPT_TIMER0"
                        id="cfg_timer_0_enable" />
                </div>
            </div>
            <br />
            <form id="timerForm0" class="OPT_TIMER0">
                <fieldset>
                    <label for="timeType0">{{ "timer_type" | translate }}</label>
                    <select id="cfg_timer_0_type" name="timeType0" data-toggle="timeInputs"
                        onchange="toggleTimeInputs(this)">
                        <option value="0">{{ "time" | translate }}</option>
                        <option value="1">{{ "sunrise" | translate }}</option>
                        <option value="2">{{ "sundown" | translate }}</option>
                    </select>

                    <div class="time-input" id="timeInput0">
                        <label for="timeValue0">{{ "time_HH_MM" | translate }}</label>
                        <input type="time" id="cfg_timer_0_time_value" name="timeValue0" />
                    </div>

                    <div class="time-input" id="offsetInput0" style="display: none">
                        <label for="offsetValue0">{{ "offset_desc" | translate }}</label>
                        <input type="number" id="cfg_timer_0_offset_value" name="offsetValue0" placeholder="0"
                            step="1" />
                    </div>

                    <!-- min/max time settings for sunrise/sundown -->
                    <div id="timer0-minmaxtime-settings" style="display: none">
                        <div class="minmaxtime-switch">
                            <input data-toggle="timeInputs" name="timer0_use_min_time" type="checkbox" role="switch"
                                hideOpt="OPT_MINTIME0" id="cfg_timer_0_use_min_time" />

                            <label for="timer0_use_min_time">{{ "use_min_time" | translate }}</label>
                        </div>

                        <div class="time-input OPT_MINTIME0" id="minTimeInput0">
                            <input type="time" id="cfg_timer_0_min_time_value" name="minTimeValue0" />
                        </div>

                        <div class="minmaxtime-switch">
                            <input data-toggle="timeInputs" name="timer0_use_max_time" type="checkbox" role="switch"
                                hideOpt="OPT_MAXTIME0" id="cfg_timer_0_use_max_time" />

                            <label for="timer0_use_max_time">{{ "use_max_time" | translate }}</label>
                        </div>

                        <div class="time-input OPT_MAXTIME0" id="maxTimeInput0">
                            <input type="time" id="cfg_timer_0_max_time_value" name="maxTimeValue0" />
                        </div>
                    </div>

                    <!-- Dropdown for shutter cmd -->
                    <label for="command0">{{ "command" | translate }}</label>
                    <select id="cfg_timer_0_cmd" name="command0">
                        <option value="0">{{ "cmd_up" | translate }}</option>
                        <option value="1">{{ "cmd_down" | translate }}</option>
                        <option value="2">{{ "cmd_shade" | translate }}</option>
                    </select>

                    <!-- Checkbox for wekdays -->
                    <label>{{ "weekdays" | translate }}</label>
                    <div class="grid">
                        <div>
                            <input type="checkbox" id="cfg_timer_0_monday" name="days0" />
                            <label for="monday0">{{ "day_mo" | translate }}</label>
                        </div>
                        <div>
                            <input type="checkbox" id="cfg_timer_0_tuesday" name="days0" />
                            <label for="tuesday0">{{ "day_tu" | translate }}</label>
                        </div>
                        <div>
                            <input type="checkbox" id="cfg_timer_0_wednesday" name="days0" />
                            <label for="wednesday0">{{ "day_we" | translate }}</label>
                        </div>
                        <div>
                            <input type="checkbox" id="cfg_timer_0_thursday" name="days0" />
                            <label for="thursday0">{{ "day_th" | translate }}</label>
                        </div>
                        <div>
                            <input type="checkbox" id="cfg_timer_0_friday" name="days0" />
                            <label for="friday0">{{ "day_fr" | translate }}</label>
                        </div>
                        <br />
                        <div>
                            <input type="checkbox" id="cfg_timer_0_saturday" name="days0" />
                            <label for="saturday0">{{ "day_sa" | translate }}</label>
                        </div>
                        <div>
                            <input type="checkbox" id="cfg_timer_0_sunday" name="days0" />
                            <label for="sunday0">{{ "day_su" | translate }}</label>
                        </div>
                    </div>
                    <!-- selection of shutter -->
                    <div>
                        <div class="leftright">
                            <label for="mask_timer0">{{ "mask" | translate }}</label>
                            <button onclick="openGrpMaskHelp(this)" class="i_help" style="
                    height: 20px;
                    background-color: transparent;
                    border: none;
                  "></button>
                        </div>
                        <input class="bitmask-input" name="mask_timer0" type="text" data-type="bin"
                            id="cfg_timer_0_grp_mask" oninput="validateBin(this)" onblur="formatBin(this)"
                            pattern="[01]{1,16}" placeholder="Enter Bit-Mask (0 and 1 only, 16 chars)" maxlength="16" />
                    </div>
                    <br />
                </fieldset>
            </form>
        </div>
    </article>
